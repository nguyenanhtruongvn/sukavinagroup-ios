name: Sync source to VPS

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - 'apps/android/**'
      - 'apps/ios/**'
      - '.github/workflows/build-android.yml'
      - '.github/workflows/build-ios-unsigned.yml'
      - '.github/workflows/sync-vps.yml'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Trust VPS host key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Pull source on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PROJECT_DIR: ${{ secrets.VPS_PROJECT_DIR || '/opt/projects/sukavina' }}
        run: |
          set -euo pipefail
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" bash -s -- "$VPS_PROJECT_DIR" <<'REMOTE'
          set -euo pipefail
          project_dir="$1"
          cd "$project_dir"

          # Keep the VPS-specific compose file and local environment intact.
          compose_backup="$(mktemp)"
          trap 'rm -f "$compose_backup"' EXIT
          cp docker-compose.yml "$compose_backup"
          git checkout -- docker-compose.yml
          git pull --ff-only origin main
          cp "$compose_backup" docker-compose.yml

          if docker compose version >/dev/null 2>&1; then
            docker compose up -d --build
          elif command -v docker-compose >/dev/null 2>&1; then
            # Compose v1 cannot recreate containers from newer Docker images
            # reliably (KeyError: ContainerConfig). Build first, then replace
            # only the stateless app containers while keeping Postgres intact.
            docker-compose build api web
            docker-compose rm -sf api web
            docker-compose up -d
          else
            echo "Docker Compose is not installed" >&2
            exit 1
          fi
          REMOTE
