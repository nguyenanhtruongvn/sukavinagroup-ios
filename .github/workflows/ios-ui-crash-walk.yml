name: iOS UI crash walk

# Signs in with the test account (repository secrets
# SUKAVINA_TEST_EMPLOYEE_CODE and SUKAVINA_TEST_PASSWORD), then opens every
# screen, sheet, form and picker of the app on iOS 27, 26, 18 and 17
# simulators and fails if the app stops running. Read-only: it never taps a
# control that sends or changes data (see AppUITests/CrashWalkTests.swift).
#
# This repository is public: screenshots and result bundles (they show the
# test account's data) are not uploaded; the log names each step only.

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Run only this iOS major version (27, 26, 18 or 17); empty runs all'
        required: false
        default: ''
  push:
    branches:
      - 'fix/**'
    paths:
      - 'apps/ios/**'
      - '.github/workflows/ios-ui-crash-walk.yml'

permissions:
  contents: read

concurrency:
  group: ios-ui-crash-walk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  walk:
    # iOS 27 with the App Store toolchain; older iOS on runners that ship (or
    # can still download) those simulators, with that runner's Xcode.
    runs-on: ${{ matrix.runner }}
    # iOS 17 downloads a 7 GB simulator first.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - ios: '27'
            runner: xcode-27
            xcode: '27'
          - ios: '26'
            runner: macos-26
            xcode: '26'
          - ios: '18'
            runner: macos-15
            xcode: '16.4'
          - ios: '17'
            runner: macos-15
            xcode: '16.4'
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode ${{ matrix.xcode }}
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.only == '' || inputs.only == matrix.ios }}
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode_${{ matrix.xcode }}*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "$XCODE_APP" ]; then sudo xcode-select --switch "$XCODE_APP/Contents/Developer"; fi
          xcodebuild -version

      - name: Build the app and the UI tests (no account needed)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.only == '' || inputs.only == matrix.ios }}
        shell: bash
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project apps/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            # Ad-hoc "Sign to Run Locally": entitlements (Keychain sharing) are
            # needed for the app to keep its session on iOS 17-26 simulators.
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER=             CODE_SIGNING_REQUIRED=NO \
            > "$RUNNER_TEMP/build.log" 2>&1
          STATUS=$?
          grep -E "error:|TEST BUILD" "$RUNNER_TEMP/build.log" | tail -n 40 || true
          exit $STATUS

      - name: Check the test account secrets
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.only == '' || inputs.only == matrix.ios }}
        env:
          CODE: ${{ secrets.SUKAVINA_TEST_EMPLOYEE_CODE }}
          PASSWORD: ${{ secrets.SUKAVINA_TEST_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$CODE" ] || [ -z "$PASSWORD" ]; then
            echo "::error::Add the repository secrets SUKAVINA_TEST_EMPLOYEE_CODE and SUKAVINA_TEST_PASSWORD (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: iOS ${{ matrix.ios }} simulator
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.only == '' || inputs.only == matrix.ios }}
        id: sim
        shell: bash
        run: |
          set +e
          set -uo pipefail
          find_runtime() {
            xcrun simctl list runtimes -j | python3 -c "
          import json, sys
          major = sys.argv[1]
          rts = [r for r in json.load(sys.stdin)['runtimes'] if r.get('platform') == 'iOS' and r.get('isAvailable') and r['version'].split('.')[0] == major]
          rts.sort(key=lambda r: ('iPhone' not in r['identifier'].split('SimRuntime.')[-1], [int(x) for x in r['version'].split('.')]))
          print(rts[-1]['identifier'] if rts else '')
          " "${{ matrix.ios }}"
          }
          RUNTIME="$(find_runtime)"
          if [ -z "$RUNTIME" ]; then
            case "${{ matrix.ios }}" in 17) V=17.5 ;; 18) V=18.6 ;; 26) V=26.0 ;; *) V="" ;; esac
            echo "Downloading the iOS $V simulator runtime"
            if [ -n "$V" ]; then sudo xcodebuild -downloadPlatform iOS -buildVersion "$V" 2>&1 | tail -n 15; fi
            if [ -z "$(find_runtime)" ] && command -v xcodes >/dev/null; then sudo xcodes runtimes install "iOS $V" 2>&1 | tail -n 15; fi
            RUNTIME="$(find_runtime)"
          fi
          if [ -z "$RUNTIME" ]; then
            echo "::error::No iOS ${{ matrix.ios }} simulator runtime."
            exit 1
          fi
          DEVICE_TYPE="$(xcrun simctl list runtimes -j | python3 -c "
          import json, sys
          rt = [r for r in json.load(sys.stdin)['runtimes'] if r['identifier'] == sys.argv[1]][0]
          phones = [d['identifier'] for d in rt.get('supportedDeviceTypes', []) if d['name'].startswith('iPhone')]
          print(phones[-1])
          " "$RUNTIME")"
          UDID="$(xcrun simctl create "Walk iOS ${{ matrix.ios }}" "$DEVICE_TYPE" "$RUNTIME")"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using $RUNTIME on $DEVICE_TYPE ($UDID)"

      - name: Walk every screen on iOS ${{ matrix.ios }}
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.only == '' || inputs.only == matrix.ios }}
        env:
          TEST_RUNNER_SUKAVINA_TEST_EMPLOYEE_CODE: ${{ secrets.SUKAVINA_TEST_EMPLOYEE_CODE }}
          TEST_RUNNER_SUKAVINA_TEST_PASSWORD: ${{ secrets.SUKAVINA_TEST_PASSWORD }}
        shell: bash
        run: |
          set +e
          xcodebuild test-without-building \
            -project apps/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath "$RUNNER_TEMP/walk.xcresult" \
            # Ad-hoc "Sign to Run Locally": entitlements (Keychain sharing) are
            # needed for the app to keep its session on iOS 17-26 simulators.
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER=             CODE_SIGNING_REQUIRED=NO \
            > "$RUNNER_TEMP/test.log" 2>&1
          STATUS=$?
          grep -E "WALK:|Test Case|error:|XCTAssert|TEST EXECUTE|TEST SUCCEEDED|TEST FAILED" "$RUNNER_TEMP/test.log" | tail -n 150 || true
          if [ $STATUS -ne 0 ] && ! grep -q "Test Case" "$RUNNER_TEMP/test.log"; then
            echo "---- xcodebuild output (tail) ----"
            tail -n 60 "$RUNNER_TEMP/test.log"
          fi
          # Step names only (no screenshots: the repository is public).
          xcrun xcresulttool get test-results activities --path "$RUNNER_TEMP/walk.xcresult" \
            --test-id "CrashWalkTests/testOpenEveryScreenWithoutSending()" 2>/dev/null | python3 -c "
          import json, sys
          try:
              data = json.load(sys.stdin)
          except Exception:
              sys.exit(0)
          def walk(items):
              for a in items:
                  for att in a.get('attachments', []):
                      print('  step', att.get('name', ''))
                  walk(a.get('childActivities', []))
          for run in data.get('testRuns', []):
              walk(run.get('activities', []))
          " || true
          # The app's crash reports: exception and crashed-thread frames only.
          for f in ~/Library/Logs/DiagnosticReports/App[-_]*.ips; do
            [ -e "$f" ] || continue
            echo "==== $(basename "$f")"
            python3 - "$f" <<'PY'
          import json, sys
          text = open(sys.argv[1]).read()
          body = json.loads(text.split(chr(10), 1)[1])
          print('exception:', body.get('exception'))
          print('termination:', body.get('termination', {}).get('indicator'))
          for key in ('asi', 'lastExceptionBacktrace'):
              if key in body:
                  print(key + ':', json.dumps(body[key])[:1500])
          images = body.get('usedImages', [])
          thread = next((t for t in body.get('threads', []) if t.get('triggered')), None)
          if thread:
              for frame in thread.get('frames', [])[:40]:
                  image = images[frame.get('imageIndex', 0)].get('name', '?') if images else '?'
                  print('  ', image, frame.get('symbol', ''), '+', frame.get('symbolLocation', ''))
          PY
          done
          exit $STATUS
