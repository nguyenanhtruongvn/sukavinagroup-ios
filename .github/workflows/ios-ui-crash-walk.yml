name: iOS UI crash walk

# Signs in with the test account (repository secrets
# SUKAVINA_TEST_EMPLOYEE_CODE and SUKAVINA_TEST_PASSWORD), then opens every
# screen, sheet, form and picker of the app on iOS 27, 26, 18 and 17
# simulators and fails if the app stops running. Read-only: it never taps a
# control that sends or changes data (see AppUITests/CrashWalkTests.swift).
#
# This repository is public: screenshots and result bundles (they show the
# test account's data) are not uploaded; the log names each step only.

on:
  workflow_dispatch:
  push:
    branches:
      - 'fix/**'
    paths:
      - 'apps/ios/**'
      - '.github/workflows/ios-ui-crash-walk.yml'

permissions:
  contents: read

concurrency:
  group: ios-ui-crash-walk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  walk:
    runs-on: xcode-27
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        ios: ['27', '26', '18', '17']
    steps:
      - uses: actions/checkout@v6

      - name: Check the test account secrets
        env:
          CODE: ${{ secrets.SUKAVINA_TEST_EMPLOYEE_CODE }}
          PASSWORD: ${{ secrets.SUKAVINA_TEST_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$CODE" ] || [ -z "$PASSWORD" ]; then
            echo "::error::Add the repository secrets SUKAVINA_TEST_EMPLOYEE_CODE and SUKAVINA_TEST_PASSWORD (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Select Xcode 27
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "$XCODE_APP" ]; then sudo xcode-select --switch "$XCODE_APP/Contents/Developer"; fi
          xcodebuild -version

      - name: iOS ${{ matrix.ios }} simulator
        id: sim
        shell: bash
        run: |
          set -uo pipefail
          find_runtime() {
            xcrun simctl list runtimes -j | python3 -c "
          import json, sys
          major = sys.argv[1]
          rts = [r for r in json.load(sys.stdin)['runtimes'] if r.get('platform') == 'iOS' and r.get('isAvailable') and r['version'].split('.')[0] == major]
          rts.sort(key=lambda r: ('iPhone' not in r['identifier'].split('SimRuntime.')[-1], [int(x) for x in r['version'].split('.')]))
          print(rts[-1]['identifier'] if rts else '')
          " "${{ matrix.ios }}"
          }
          RUNTIME="$(find_runtime)"
          if [ -z "$RUNTIME" ]; then
            case "${{ matrix.ios }}" in 17) V=17.5 ;; 18) V=18.6 ;; 26) V=26.0 ;; *) V="" ;; esac
            echo "Downloading the iOS $V simulator runtime"
            [ -n "$V" ] && sudo xcodebuild -downloadPlatform iOS -buildVersion "$V" 2>&1 | tail -n 15
            command -v xcodes >/dev/null && [ -z "$(find_runtime)" ] && sudo xcodes runtimes install "iOS $V" 2>&1 | tail -n 15
            RUNTIME="$(find_runtime)"
          fi
          if [ -z "$RUNTIME" ]; then
            echo "::error::No iOS ${{ matrix.ios }} simulator runtime."
            exit 1
          fi
          DEVICE_TYPE="$(xcrun simctl list runtimes -j | python3 -c "
          import json, sys
          rt = [r for r in json.load(sys.stdin)['runtimes'] if r['identifier'] == sys.argv[1]][0]
          phones = [d['identifier'] for d in rt.get('supportedDeviceTypes', []) if d['name'].startswith('iPhone')]
          print(phones[-1])
          " "$RUNTIME")"
          UDID="$(xcrun simctl create "Walk iOS ${{ matrix.ios }}" "$DEVICE_TYPE" "$RUNTIME")"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using $RUNTIME on $DEVICE_TYPE ($UDID)"

      - name: Walk every screen on iOS ${{ matrix.ios }}
        env:
          TEST_RUNNER_SUKAVINA_TEST_EMPLOYEE_CODE: ${{ secrets.SUKAVINA_TEST_EMPLOYEE_CODE }}
          TEST_RUNNER_SUKAVINA_TEST_PASSWORD: ${{ secrets.SUKAVINA_TEST_PASSWORD }}
        shell: bash
        run: |
          set -o pipefail
          xcodebuild test \
            -project apps/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath "$RUNNER_TEMP/walk.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/test.log" | grep -E "Test Case|error:|failed|passed|XCTAssert|crash|Crash|\*\* TEST" || true
          STATUS=${PIPESTATUS[0]}
          # Step names (no screenshots: the repository is public).
          xcrun xcresulttool get test-results activities --path "$RUNNER_TEMP/walk.xcresult" --test-id "CrashWalkTests/testOpenEveryScreenWithoutSending()" 2>/dev/null \
            | python3 -c "
          import json, sys
          try:
              data = json.load(sys.stdin)
          except Exception:
              sys.exit(0)
          def walk(items, depth=0):
              for a in items:
                  for att in a.get('attachments', []):
                      print('  step:', att.get('name', ''))
                  walk(a.get('childActivities', []), depth + 1)
          for run in data.get('testRuns', []):
              walk(run.get('activities', []))
          " || true
          ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i "^App" || true
          exit $STATUS
