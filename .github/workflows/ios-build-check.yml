name: iOS build check

# Compiles the App target and its embedded AttendanceWidget extension (Release,
# unsigned) on every push to main and every pull request that touches the iOS
# app, so compile errors and the Release iOS 17 linkage check (SwiftUICore
# must not be strongly linked) fail the PR instead of a release build.
# Uses a GitHub-hosted macOS runner and no secrets: never run PR code on the
# self-hosted runner. Nothing is uploaded.
on:
  push:
    branches:
      - main
    paths:
      - apps/ios/**
      - .github/workflows/ios-build-check.yml
  pull_request:
    paths:
      - apps/ios/**
      - .github/workflows/ios-build-check.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Build App and AttendanceWidget (Release, unsigned)
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project apps/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Verify the widget extension was built and embedded
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH='build/DerivedData/Build/Products/Release-iphoneos/App.app'
          test -d "$APP_PATH"
          test -d "$APP_PATH/PlugIns/AttendanceWidget.appex"
          echo "App and AttendanceWidget compiled."
