name: iOS build check

# Compiles the App target and its embedded AttendanceWidget extension (Release,
# unsigned) on every push (any branch, so a fix branch is checked before it is
# merged into main without a PR) and every pull request that touches the iOS
# app, so compile errors and the Release iOS 17 linkage check (SwiftUICore
# must not be strongly linked) fail before a release build.
# Uses a GitHub-hosted macOS runner and no secrets: never run PR code on the
# self-hosted runner. Nothing is uploaded.
on:
  push:
    branches:
      - '**'
    paths:
      - apps/ios/**
      - .github/workflows/ios-build-check.yml
  pull_request:
    paths:
      - apps/ios/**
      - .github/workflows/ios-build-check.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          # App Store uploads need the iOS 27 SDK (Xcode 27+) from April 2027
          # (ITMS-90725). Use the newest Xcode 27 on the runner; fail otherwise.
          XCODE_APP="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "$XCODE_APP" ]; then sudo xcode-select --switch "$XCODE_APP/Contents/Developer"; fi
          xcodebuild -version
          XCODE_MAJOR="$(xcodebuild -version | awk '/^Xcode /{split($2, v, "."); print v[1]}')"
          test "${XCODE_MAJOR:-0}" -ge 27 || { echo "error: Xcode 27 or later is required (found ${XCODE_MAJOR:-none})." >&2; ls -d /Applications/Xcode*.app >&2 || true; exit 1; }
          xcodebuild -showsdks | grep -i 'iphoneos' || true

      - name: Build App and AttendanceWidget (Release, unsigned)
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project apps/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Verify the widget extension was built and embedded
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH='build/DerivedData/Build/Products/Release-iphoneos/App.app'
          test -d "$APP_PATH"
          test -d "$APP_PATH/PlugIns/AttendanceWidget.appex"
          echo "App and AttendanceWidget compiled."
