name: Read VPS AGENTS

on:
  push:
    branches:
      - chatgpt/read-vps-agents

permissions:
  contents: read

jobs:
  read-agents:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Read AGENTS.md
        shell: bash
        run: |
          set -euo pipefail
          TARGET=/root/sukavina/AGENTS.md
          if sudo -n test -f "$TARGET"; then
            sudo -n cat "$TARGET"
          else
            echo "AGENTS_REQUIRES_SUDO_PASSWORD_OR_FILE_NOT_FOUND"
            exit 3
          fi
