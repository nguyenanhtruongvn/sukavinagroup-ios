name: ChatGPT short meeting timeline patch

on:
  push:
    branches:
      - chatgpt/short-meeting-timeline

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/short-meeting-timeline
          fetch-depth: 0

      - name: Patch short meeting timeline UI
        run: python3 .github/scripts/patch_short_meeting.py

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/ios/App/App/EmployeeViews.swift
          git commit -m 'Refine short meeting timeline presentation'
          git push origin HEAD:chatgpt/short-meeting-timeline
