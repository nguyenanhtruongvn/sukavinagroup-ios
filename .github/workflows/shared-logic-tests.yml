name: Shared logic tests

# Runs the SwiftPM unit tests for the Foundation-only code in
# apps/ios/App/App/Shared on every push (any branch, so a fix branch is
# checked before it is merged into main) and every pull request that touches
# the iOS sources. Uses a GitHub-hosted macOS runner only: never run
# PR code on the self-hosted runner.
on:
  push:
    branches:
      - '**'
    paths:
      - apps/ios/**
      - .github/workflows/shared-logic-tests.yml
  pull_request:
    paths:
      - apps/ios/**
      - .github/workflows/shared-logic-tests.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-logic-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-test:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Run shared logic unit tests
        shell: bash
        run: |
          set -euo pipefail
          # App Store uploads need the iOS 27 SDK (Xcode 27+) from April 2027
          # (ITMS-90725). Use the newest Xcode 27 on the runner; fail otherwise.
          XCODE_APP="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "$XCODE_APP" ]; then sudo xcode-select --switch "$XCODE_APP/Contents/Developer"; fi
          xcodebuild -version
          XCODE_MAJOR="$(xcodebuild -version | awk '/^Xcode /{split($2, v, "."); print v[1]}')"
          test "${XCODE_MAJOR:-0}" -ge 27 || { echo "error: Xcode 27 or later is required (found ${XCODE_MAJOR:-none})." >&2; ls -d /Applications/Xcode*.app >&2 || true; exit 1; }
          xcodebuild -showsdks | grep -i 'iphoneos' || true
          swift --version
          swift test --package-path apps/ios/App
