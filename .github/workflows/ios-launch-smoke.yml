name: iOS launch smoke test

# Builds the app once with Xcode 27 (the App Store toolchain), then launches
# that same build on iOS simulators of each supported major version, failing
# if the app crashes or stops (for example the iOS 27 "no UIScene lifecycle"
# launch stop). Older runtimes come from the runner images that ship them.

on:
  workflow_dispatch:
  push:
    branches:
      - 'fix/**'
    paths:
      - 'apps/ios/**'
      - '.github/workflows/ios-launch-smoke.yml'

permissions:
  contents: read

concurrency:
  group: ios-launch-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Build for the simulator with Xcode 27
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "$XCODE_APP" ]; then sudo xcode-select --switch "$XCODE_APP/Contents/Developer"; fi
          xcodebuild -version
          xcodebuild \
            -project apps/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/Sim \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build | tail -n 20
          cd build/Sim/Build/Products/Release-iphonesimulator
          ditto -c -k --keepParent App.app "$GITHUB_WORKSPACE/App-sim.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: App-sim
          path: App-sim.zip

  launch:
    needs: build
    # iOS 17 has to download its simulator runtime first.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - ios: '27'
            runner: xcode-27
          - ios: '26'
            runner: macos-26
          - ios: '18'
            runner: macos-15
          - ios: '17'
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: App-sim

      - name: Find an iOS ${{ matrix.ios }} simulator runtime
        id: runtime
        shell: bash
        run: |
          set -uo pipefail
          sw_vers
          xcrun simctl list runtimes
          RUNTIME="$(xcrun simctl list runtimes -j | python3 -c "
          import json, sys
          major = sys.argv[1]
          rts = [r for r in json.load(sys.stdin)['runtimes'] if r.get('platform') == 'iOS' and r.get('isAvailable') and r['version'].split('.')[0] == major]
          # Plain runtimes first (not device-specific ones such as iOS-27-2-iPhone19-4).
          rts.sort(key=lambda r: ('iPhone' not in r['identifier'].split('SimRuntime.')[-1], [int(x) for x in r['version'].split('.')]))
          print(rts[-1]['identifier'] if rts else '')
          " "${{ matrix.ios }}")"
          if [ -z "$RUNTIME" ] && [ "${{ matrix.ios }}" = "17" ]; then
            # Not preinstalled: fetch iOS 17.5 (xcodes ships on the runner image).
            X16="$(ls -d /Applications/Xcode_16.4*.app 2>/dev/null | head -n 1)"
            [ -n "$X16" ] && sudo xcode-select --switch "$X16/Contents/Developer"
            xcodebuild -version || true
            if command -v xcodes >/dev/null; then
              timeout 2400 sudo xcodes runtimes install "iOS 17.5" 2>&1 | tail -n 30 || true
            fi
            if ! xcrun simctl list runtimes | grep -q "iOS 17"; then
              timeout 2400 sudo xcodebuild -downloadPlatform iOS -buildVersion 17.5 2>&1 | tail -n 30 || true
            fi
            xcrun simctl list runtimes
            RUNTIME="$(xcrun simctl list runtimes -j | python3 -c "
          import json, sys
          rts = [r for r in json.load(sys.stdin)['runtimes'] if r.get('platform') == 'iOS' and r.get('isAvailable') and r['version'].startswith('17.')]
          print(rts[-1]['identifier'] if rts else '')
          ")"
          fi
          if [ -z "$RUNTIME" ]; then
            echo "::error::No iOS ${{ matrix.ios }} simulator runtime on ${{ matrix.runner }}."
            exit 1
          fi
          echo "runtime=$RUNTIME" >> "$GITHUB_OUTPUT"
          echo "Using $RUNTIME"

      - name: Launch on iOS ${{ matrix.ios }} and check it keeps running
        shell: bash
        run: |
          set -euo pipefail
          ditto -x -k App-sim.zip .
          RUNTIME="${{ steps.runtime.outputs.runtime }}"
          DEVICE_TYPE="$(xcrun simctl list devicetypes -j | python3 -c "
          import json, sys
          names = [d['identifier'] for d in json.load(sys.stdin)['devicetypes'] if d['name'].startswith('iPhone')]
          preferred = [n for n in names if 'iPhone-15' in n or 'iPhone-16' in n]
          print((preferred or names)[0])
          ")"
          UDID="$(xcrun simctl create "Smoke iOS ${{ matrix.ios }}" "$DEVICE_TYPE" "$RUNTIME")"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          mkdir -p ~/Library/Logs/DiagnosticReports
          BEFORE="$(date +%s)"
          xcrun simctl install "$UDID" App.app
          LAUNCH="$(xcrun simctl launch "$UDID" net.sukavinagroup.user)"
          echo "$LAUNCH"
          PID="$(echo "$LAUNCH" | awk -F': ' '{print $2}')"
          sleep 20
          xcrun simctl io "$UDID" screenshot "screen-ios${{ matrix.ios }}.png" || true
          # Only this app's crash reports, written after the launch.
          CRASHED=""
          for f in ~/Library/Logs/DiagnosticReports/*.ips; do
            [ -e "$f" ] || continue
            [ "$(stat -f %m "$f")" -ge "$BEFORE" ] || continue
            if grep -q 'net.sukavinagroup.user' "$f"; then
              echo "== $f"; head -c 8000 "$f"; echo
              CRASHED=1
            fi
          done
          if [ -n "$CRASHED" ]; then
            echo "::error::The app crashed on iOS ${{ matrix.ios }}."
            exit 1
          fi
          if ! ps -p "$PID" > /dev/null; then
            echo "::error::The app is not running 20 s after launch on iOS ${{ matrix.ios }}."
            exit 1
          fi
          echo "iOS ${{ matrix.ios }} ($RUNTIME): launched and still running after 20 s (pid $PID)."

      - name: Keep the screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-ios${{ matrix.ios }}
          path: screen-ios${{ matrix.ios }}.png
          if-no-files-found: ignore
