name: Audit iOS 17 SwiftUI compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Build the production source without signing
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          xcodebuild \
            -project apps/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios17-link-audit" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            SWIFT_COMPILATION_MODE=incremental \
            clean build

      - name: Identify every source object that autolinks SwiftUICore
        shell: bash
        run: |
          set -euo pipefail
          audit_dir="$RUNNER_TEMP/ios17-link-audit"
          object_dir="$audit_dir/Build/Intermediates.noindex/App.build/Release-iphoneos/App.build/Objects-normal/arm64"
          app_binary="$audit_dir/Build/Products/Release-iphoneos/App.app/App"
          test -d "$object_dir"
          test -f "$app_binary"

          : > "$RUNNER_TEMP/swiftuicore-autolink-sources.txt"
          while IFS= read -r -d '' object_file; do
            references="$(strings "$object_file" | grep 'SwiftUICore' || true)"
            if test -n "$references"; then
              printf '%s\n%s\n\n' "$object_file" "$references" | tee -a "$RUNNER_TEMP/swiftuicore-autolink-sources.txt"
            fi
          done < <(find "$object_dir" -name '*.o' -print0)

          echo '--- App load commands ---'
          otool -L "$app_binary"
          echo '--- SwiftUICore source objects ---'
          if test -s "$RUNNER_TEMP/swiftuicore-autolink-sources.txt"; then
            cat "$RUNNER_TEMP/swiftuicore-autolink-sources.txt"
          else
            echo 'No App source object autolinks SwiftUICore.'
          fi

      - name: Upload link audit
        uses: actions/upload-artifact@v4
        with:
          name: ios17-swiftui-link-audit
          path: ${{ runner.temp }}/swiftuicore-autolink-sources.txt
          if-no-files-found: error

  xcode15-ios17-build:
    # macos-latest ships only Xcode 26.  macos-13 retains the Xcode 15.4
    # toolchain required for this controlled iOS 17 comparison.
    runs-on: macos-13
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Build the same native app with the iOS 17 toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version
          xcodebuild \
            -project apps/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios17-xcode15" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build
          app_binary="$RUNNER_TEMP/ios17-xcode15/Build/Products/Release-iphoneos/App.app/App"
          test -f "$app_binary"
          if otool -L "$app_binary" | grep -q 'SwiftUICore.framework'; then
            echo 'error: The Xcode 15.4 app still links SwiftUICore.'
            exit 1
          fi
          otool -L "$app_binary"
