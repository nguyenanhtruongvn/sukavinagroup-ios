name: Audit iOS 17 SwiftUI compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Build the production source without signing
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          xcodebuild \
            -project apps/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios17-link-audit" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Identify every source object that autolinks SwiftUICore
        shell: bash
        run: |
          set -euo pipefail
          audit_dir="$RUNNER_TEMP/ios17-link-audit"
          object_dir="$audit_dir/Build/Intermediates.noindex/App.build/Release-iphoneos/App.build/Objects-normal/arm64"
          app_binary="$audit_dir/Build/Products/Release-iphoneos/App.app/App"
          test -d "$object_dir"
          test -f "$app_binary"

          : > "$RUNNER_TEMP/swiftuicore-autolink-sources.txt"
          while IFS= read -r -d '' object_file; do
            references="$(strings "$object_file" | grep 'SwiftUICore' || true)"
            if test -n "$references"; then
              printf '%s\n%s\n\n' "$object_file" "$references" | tee -a "$RUNNER_TEMP/swiftuicore-autolink-sources.txt"
            fi
          done < <(find "$object_dir" -name '*.o' -print0)

          echo '--- App load commands ---'
          otool -L "$app_binary"
          echo '--- SwiftUICore source objects ---'
          if test -s "$RUNNER_TEMP/swiftuicore-autolink-sources.txt"; then
            cat "$RUNNER_TEMP/swiftuicore-autolink-sources.txt"
          else
            echo 'No App source object autolinks SwiftUICore.'
          fi

      - name: Upload link audit
        uses: actions/upload-artifact@v4
        with:
          name: ios17-swiftui-link-audit
          path: ${{ runner.temp }}/swiftuicore-autolink-sources.txt
          if-no-files-found: error

  xcode16-ios17-build:
    # macos-13 and Xcode 15.4 have been retired from GitHub-hosted runners.
    # Keep this comparison on the oldest currently supported macOS image and
    # its installed Xcode 16.4 toolchain, separate from the Xcode 26 audit.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Build the same native app with Xcode 16.4
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          xcodebuild \
            -project apps/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios17-xcode16" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build
          app_binary="$RUNNER_TEMP/ios17-xcode16/Build/Products/Release-iphoneos/App.app/App"
          test -f "$app_binary"
          # A SwiftUICore load command is acceptable only when weak.  The
          # target's build phase performs that assertion; retain the full
          # Mach-O report here for the Xcode 16 vs Xcode 26 comparison.
          otool -L "$app_binary"
          otool -l "$app_binary" | awk '
            $1 == "cmd" && $2 == "LC_LOAD_WEAK_DYLIB" { weak = 1; next }
            $1 == "cmd" { weak = 0 }
            weak && $1 == "name" && $2 ~ /SwiftUICore\\.framework/ { print "SwiftUICore linkage: weak"; found = 1 }
            END { if (!found) print "SwiftUICore linkage: absent" }
          '

  xcode26-implicit-modules-build:
    # Isolate the only build flag that can change module metadata emission.
    # Do not disable Swift autolinking: that made a previous archive invalid.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Build with Xcode 26 and implicit Swift modules
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          xcodebuild \
            -project apps/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios17-xcode26-implicit" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            clean build
          app_binary="$RUNNER_TEMP/ios17-xcode26-implicit/Build/Products/Release-iphoneos/App.app/App"
          test -f "$app_binary"
          otool -L "$app_binary"
          otool -l "$app_binary" | awk '
            $1 == "cmd" && $2 == "LC_LOAD_WEAK_DYLIB" { weak = 1; next }
            $1 == "cmd" { weak = 0 }
            weak && $1 == "name" && $2 ~ /SwiftUICore\\.framework/ { print "SwiftUICore linkage: weak"; found = 1 }
            END { if (!found) print "SwiftUICore linkage: absent" }
          '
