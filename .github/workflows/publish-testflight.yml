name: Publish iOS to TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sukavina-testflight
  cancel-in-progress: false

jobs:
  archive-and-upload:
    name: Archive and upload TestFlight build
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      MARKETING_VERSION: 1.0.0
      APP_BUNDLE_ID: net.sukavinagroup.user
      WIDGET_BUNDLE_ID: net.sukavinagroup.user.AttendanceWidget
      IOS_TEAM_ID: TZWRHJ9UYN
      IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
      IOS_WIDGET_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_APPSTORE_PROFILE_BASE64 }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_PRIVATE_KEY_BASE64: ${{ secrets.APPSTORE_PRIVATE_KEY_BASE64 }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Validate release secrets
        shell: bash
        run: |
          set -euo pipefail
          required=(
            IOS_DISTRIBUTION_CERTIFICATE_BASE64
            IOS_DISTRIBUTION_CERTIFICATE_PASSWORD
            IOS_APPSTORE_PROFILE_BASE64
            IOS_WIDGET_APPSTORE_PROFILE_BASE64
            APPSTORE_ISSUER_ID
            APPSTORE_KEY_ID
            APPSTORE_PRIVATE_KEY_BASE64
          )
          for name in "${required[@]}"; do
            test -n "${!name:-}" || { echo "Missing repository secret: $name" >&2; exit 1; }
          done

      - name: Configure signing certificate and provisioning profiles
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          TEMP_DIR="$RUNNER_TEMP/testflight-signing"
          KEYCHAIN_PATH="$RUNNER_TEMP/sukavina-testflight.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          mkdir -p "$TEMP_DIR" "$HOME/Library/MobileDevice/Provisioning Profiles"

          echo "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 -D > "$TEMP_DIR/distribution.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$TEMP_DIR/distribution.p12" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          install_profile() {
            local encoded="$1"
            local label="$2"
            local profile="$TEMP_DIR/${label}.mobileprovision"
            local plist="$TEMP_DIR/${label}.plist"
            echo "$encoded" | base64 -D > "$profile"
            security cms -D -i "$profile" > "$plist"
            local uuid name
            uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$plist")
            name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$plist")
            cp "$profile" "$HOME/Library/MobileDevice/Provisioning Profiles/${uuid}.mobileprovision"
            printf '%s' "$name"
          }

          APP_PROFILE_NAME="$(install_profile "$IOS_APPSTORE_PROFILE_BASE64" app)"
          WIDGET_PROFILE_NAME="$(install_profile "$IOS_WIDGET_APPSTORE_PROFILE_BASE64" widget)"
          {
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "TEMP_DIR=$TEMP_DIR"
            echo "APP_PROFILE_NAME=$APP_PROFILE_NAME"
            echo "WIDGET_PROFILE_NAME=$WIDGET_PROFILE_NAME"
          } >> "$GITHUB_ENV"

      - name: Archive signed Release build
        shell: bash
        run: |
          set -euo pipefail
          # GitHub run numbers are monotonic for this workflow. Re-run from a
          # new dispatch instead of "Re-run jobs" after a successful upload.
          BUILD_NUMBER="$GITHUB_RUN_NUMBER"
          ARCHIVE_PATH="$RUNNER_TEMP/Sukavina.xcarchive"
          xcodebuild \
            -project apps/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            clean archive
          test -d "$ARCHIVE_PATH"
          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Export App Store IPA
        shell: bash
        run: |
          set -euo pipefail
          EXPORT_PATH="$RUNNER_TEMP/export"
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          mkdir -p "$EXPORT_PATH"
          /usr/libexec/PlistBuddy -c 'Add :method string app-store' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string manual' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :teamID string '"$IOS_TEAM_ID" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles:'"$APP_BUNDLE_ID"' string '"$APP_PROFILE_NAME" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles:'"$WIDGET_BUNDLE_ID"' string '"$WIDGET_PROFILE_NAME" "$EXPORT_OPTIONS"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS"
          IPA_PATH="$EXPORT_PATH/Sukavina.ipa"
          test -f "$IPA_PATH"
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Upload build to App Store Connect
        shell: bash
        run: |
          set -euo pipefail
          API_KEY_DIR="$HOME/.appstoreconnect/private_keys"
          API_KEY_PATH="$API_KEY_DIR/AuthKey_${APPSTORE_KEY_ID}.p8"
          mkdir -p "$API_KEY_DIR"
          echo "$APPSTORE_PRIVATE_KEY_BASE64" | base64 -D > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -rf "${TEMP_DIR:-}" "$HOME/.appstoreconnect/private_keys"
