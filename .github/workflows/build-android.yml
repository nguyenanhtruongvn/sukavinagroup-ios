name: Build native Android AAB

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Google Play version shown to testers; increase for every published update"
        required: true
        default: "1.0.4"
        type: string
      version_code:
        description: "Monotonic Google Play internal version code"
        required: true
        default: "31"
        type: string

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK used by the project
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;36.0.0"
      - name: Validate store-compliant Android version
        id: android-version
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import re

          name = os.environ["VERSION_NAME"]
          code = int(os.environ["VERSION_CODE"])
          assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", name), "version_name must use x.y.z"
          assert code > 0, "version_code must be a positive integer"
          print(f"code={code}")
          print(f"name={name}")
          PY
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
      - name: Configure Firebase Android client
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          test -n "${GOOGLE_SERVICES_JSON_BASE64:-}" || {
            echo "::error::Missing GOOGLE_SERVICES_JSON_BASE64 repository secret."
            exit 1
          }
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > apps/android/app/google-services.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("apps/android/app/google-services.json").read_text())
          packages = {
              client["client_info"]["android_client_info"]["package_name"]
              for client in config.get("client", [])
          }
          assert "net.sukavinagroup.user" in packages, "google-services.json is for a different Android package"
          PY

      - name: Prepare required Google Play upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for value in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            test -n "${!value:-}" || { echo "::error::Missing $value repository secret."; exit 1; }
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sukavina-upload.p12"
          keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/sukavina-upload.p12" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Build signed release AAB
        working-directory: apps/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/sukavina-upload.p12
          ANDROID_KEYSTORE_TYPE: PKCS12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon \
            -PversionCode="${{ steps.android-version.outputs.code }}" \
            -PversionName="${{ steps.android-version.outputs.name }}" \
            lintRelease bundleRelease

      - uses: actions/upload-artifact@v7
        with:
          name: Sukavina-Android-release-AAB
          path: apps/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
