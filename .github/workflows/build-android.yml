name: Build native Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'apps/android/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build native Kotlin APK
        working-directory: apps/android
        run: gradle --no-daemon lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Sukavina-Android-debug-APK
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
