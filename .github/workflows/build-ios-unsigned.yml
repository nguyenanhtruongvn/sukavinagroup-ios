name: Build unsigned iOS IPA

on:
  workflow_dispatch:
    inputs:
      publish_to_sidestore:
        description: "Tạo Release và cập nhật source SideStore"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Verify App Store toolchain
        run: |
          set -euo pipefail
          XCODE_VERSION_FILE="$(mktemp)"
          xcodebuild -version > "$XCODE_VERSION_FILE"
          cat "$XCODE_VERSION_FILE"
          XCODE_MAJOR="$(awk '/^Xcode / { split($2, version, "."); print version[1] }' "$XCODE_VERSION_FILE")"
          rm -f "$XCODE_VERSION_FILE"
          test "${XCODE_MAJOR:-0}" -ge 26

      - name: Build iOS app without code signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project apps/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            clean build

      - name: Read built app metadata
        run: |
          set -euo pipefail
          APP_PATH='build/DerivedData/Build/Products/Release-iphoneos/App.app'
          test -d "$APP_PATH"
          APP_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")
          APP_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")
          APP_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")
          test -n "$APP_VERSION"
          test -n "$APP_BUILD"
          test "$APP_BUNDLE_ID" = 'net.sukavinagroup.user'
          {
            echo "APP_VERSION=$APP_VERSION"
            echo "APP_BUILD=$APP_BUILD"
            echo "APP_BUNDLE_ID=$APP_BUNDLE_ID"
          } >> "$GITHUB_ENV"

      - name: Embed capabilities for SideStore re-signing
        run: |
          set -euo pipefail
          APP_PATH='build/DerivedData/Build/Products/Release-iphoneos/App.app'
          WIDGET_PATH="$APP_PATH/PlugIns/AttendanceWidget.appex"
          test -d "$WIDGET_PATH"
          test -f "$APP_PATH/PrivacyInfo.xcprivacy"
          test -f "$WIDGET_PATH/PrivacyInfo.xcprivacy"
          plutil -lint "$APP_PATH/PrivacyInfo.xcprivacy"
          plutil -lint "$WIDGET_PATH/PrivacyInfo.xcprivacy"
          APP_GROUP=$(/usr/libexec/PlistBuddy -c 'Print :ALTAppGroups:0' "$APP_PATH/Info.plist")
          WIDGET_GROUP=$(/usr/libexec/PlistBuddy -c 'Print :ALTAppGroups:0' "$WIDGET_PATH/Info.plist")
          test "$APP_GROUP" = 'group.net.sukavinagroup.user'
          test "$WIDGET_GROUP" = "$APP_GROUP"

          # SideStore discovers App Groups from the existing signatures before
          # replacing them with the device's personal development certificate.
          /usr/bin/codesign \
            --force \
            --sign - \
            --timestamp=none \
            --generate-entitlement-der \
            --entitlements apps/ios/App/AttendanceWidget/AttendanceWidget.entitlements \
            "$WIDGET_PATH"
          /usr/bin/codesign \
            --force \
            --sign - \
            --timestamp=none \
            --generate-entitlement-der \
            --entitlements apps/ios/App/App/App.entitlements \
            "$APP_PATH"

          /usr/bin/codesign --verify --deep --strict "$APP_PATH"
          /usr/bin/codesign -d --entitlements :- "$APP_PATH" > build/app-entitlements.plist 2>/dev/null
          /usr/bin/codesign -d --entitlements :- "$WIDGET_PATH" > build/widget-entitlements.plist 2>/dev/null
          /usr/bin/grep -q 'group.net.sukavinagroup.user' build/app-entitlements.plist
          /usr/bin/grep -q 'group.net.sukavinagroup.user' build/widget-entitlements.plist

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH='build/DerivedData/Build/Products/Release-iphoneos/App.app'
          test -d "$APP_PATH"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/Sukavina.app
          cd build
          /usr/bin/zip -qry Sukavina.ipa Payload
          shasum -a 256 Sukavina.ipa > Sukavina.ipa.sha256

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v6
        with:
          name: Sukavina-IPA
          path: |
            build/Sukavina.ipa
            build/Sukavina.ipa.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Checkout SideStore source
        if: ${{ inputs.publish_to_sidestore }}
        uses: actions/checkout@v6
        with:
          repository: nguyenanhtruongvn/sukavina-sidestore
          token: ${{ secrets.SIDESTORE_REPO_TOKEN }}
          path: sidestore-source

      - name: Publish IPA to SideStore
        if: ${{ inputs.publish_to_sidestore }}
        env:
          GH_TOKEN: ${{ secrets.SIDESTORE_REPO_TOKEN }}
          SIDESTORE_REPO: nguyenanhtruongvn/sukavina-sidestore
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || {
            echo 'Missing SIDESTORE_REPO_TOKEN repository secret.' >&2
            exit 1
          }

          TAG="v${APP_VERSION}"
          IPA_PATH="$GITHUB_WORKSPACE/build/Sukavina.ipa"
          DOWNLOAD_URL="https://github.com/${SIDESTORE_REPO}/releases/download/${TAG}/Sukavina.ipa"

          if gh release view "$TAG" --repo "$SIDESTORE_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA_PATH" --repo "$SIDESTORE_REPO" --clobber
            gh release edit "$TAG" --repo "$SIDESTORE_REPO" \
              --title "Sukavina ${APP_VERSION}" \
              --notes "Sukavina ${APP_VERSION}, build ${APP_BUILD}."
          else
            gh release create "$TAG" "$IPA_PATH" --repo "$SIDESTORE_REPO" \
              --title "Sukavina ${APP_VERSION}" \
              --notes "Sukavina ${APP_VERSION}, build ${APP_BUILD}."
          fi

          cp "$GITHUB_WORKSPACE/apps/ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png" \
            sidestore-source/icon.png
          export DOWNLOAD_URL IPA_PATH
          python3 - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          source_path = Path('sidestore-source/apps.json')
          source = json.loads(source_path.read_text(encoding='utf-8'))
          version = {
              'version': os.environ['APP_VERSION'],
              'date': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'localizedDescription': f"Sukavina {os.environ['APP_VERSION']}, build {os.environ['APP_BUILD']}.",
              'downloadURL': os.environ['DOWNLOAD_URL'],
              'size': Path(os.environ['IPA_PATH']).stat().st_size,
              'minOSVersion': '14.0',
          }
          bundle_id = os.environ['APP_BUNDLE_ID']
          app = next((item for item in source['apps'] if item.get('bundleIdentifier') == bundle_id), None)
          if app is None:
              app = {
                  'name': 'Sukavina User',
                  'bundleIdentifier': bundle_id,
                  'developerName': 'Sukavina Group',
                  'subtitle': 'Cổng thông tin nội bộ Sukavina',
                  'localizedDescription': 'Ứng dụng nội bộ dành cho nhân viên Sukavina.',
                  'iconURL': 'https://raw.githubusercontent.com/nguyenanhtruongvn/sukavina-sidestore/main/icon.png',
                  'tintColor': 'D91F2B',
                  'permissions': [
                      {'type': 'network', 'usageDescription': 'Kết nối an toàn tới hệ thống nội bộ Sukavina.'},
                      {'type': 'faceid', 'usageDescription': 'Đăng nhập an toàn bằng Face ID hoặc Touch ID khi người dùng bật tính năng.'},
                  ],
                  'versions': [],
              }
              source['apps'].append(app)
          app['versions'] = [version] + [
              item for item in app['versions'] if item.get('version') != version['version']
          ][:2]
          source_path.write_text(json.dumps(source, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          cd sidestore-source
          git config user.name 'Sukavina Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add apps.json icon.png
          if ! git diff --cached --quiet; then
            git commit -m "release: Sukavina ${APP_VERSION}"
            git push origin main
          fi
