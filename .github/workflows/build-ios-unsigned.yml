name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'apps/ios/**'
      - '.github/workflows/build-ios-unsigned.yml'

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      APP_BUILD: ${{ github.run_number }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify App Store toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          XCODE_MAJOR="$(xcodebuild -version | awk '/Xcode/ { split($2, version, "."); print version[1]; exit }')"
          test "${XCODE_MAJOR:-0}" -ge 26

      - name: Select next store-compliant version
        env:
          SIDESTORE_SOURCE_URL: https://raw.githubusercontent.com/nguyenanhtruongvn/sukavina-sidestore/main/apps.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          with urllib.request.urlopen(os.environ["SIDESTORE_SOURCE_URL"]) as response:
              source = json.load(response)
          current = source["apps"][0]["versions"][0]["version"]
          major, minor, patch = (int(part) for part in current.split("."))
          if (major, minor, patch) < (2, 0, 0):
              major, minor, patch = (2, 0, 0)
          if patch >= 99:
              patch = 1
              if minor >= 99:
                  major += 1
                  minor = 0
              else:
                  minor += 1
          else:
              patch += 1
          version = f"{major}.{minor}.{patch}"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"APP_VERSION={version}\n")
          print(f"Building iOS version {version} after {current}")
          PY

      - name: Build iOS app without code signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project apps/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$APP_BUILD" \
            clean build

      - name: Embed capabilities for SideStore re-signing
        run: |
          set -euo pipefail
          APP_PATH='build/DerivedData/Build/Products/Release-iphoneos/App.app'
          WIDGET_PATH="$APP_PATH/PlugIns/AttendanceWidget.appex"
          test -d "$WIDGET_PATH"
          test -f "$APP_PATH/PrivacyInfo.xcprivacy"
          test -f "$WIDGET_PATH/PrivacyInfo.xcprivacy"
          plutil -lint "$APP_PATH/PrivacyInfo.xcprivacy"
          plutil -lint "$WIDGET_PATH/PrivacyInfo.xcprivacy"
          APP_GROUP=$(/usr/libexec/PlistBuddy -c 'Print :ALTAppGroups:0' "$APP_PATH/Info.plist")
          WIDGET_GROUP=$(/usr/libexec/PlistBuddy -c 'Print :ALTAppGroups:0' "$WIDGET_PATH/Info.plist")
          test "$APP_GROUP" = 'group.net.sukavinagroup.portal'
          test "$WIDGET_GROUP" = "$APP_GROUP"

          # SideStore discovers App Groups from the existing signatures before
          # replacing them with the device's personal development certificate.
          /usr/bin/codesign \
            --force \
            --sign - \
            --timestamp=none \
            --generate-entitlement-der \
            --entitlements apps/ios/App/AttendanceWidget/AttendanceWidget.entitlements \
            "$WIDGET_PATH"
          /usr/bin/codesign \
            --force \
            --sign - \
            --timestamp=none \
            --generate-entitlement-der \
            --entitlements apps/ios/App/App/App.entitlements \
            "$APP_PATH"

          /usr/bin/codesign --verify --deep --strict "$APP_PATH"
          /usr/bin/codesign -d --entitlements :- "$APP_PATH" > build/app-entitlements.plist 2>/dev/null
          /usr/bin/codesign -d --entitlements :- "$WIDGET_PATH" > build/widget-entitlements.plist 2>/dev/null
          /usr/bin/grep -q 'group.net.sukavinagroup.portal' build/app-entitlements.plist
          /usr/bin/grep -q 'group.net.sukavinagroup.portal' build/widget-entitlements.plist

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH='build/DerivedData/Build/Products/Release-iphoneos/App.app'
          test -d "$APP_PATH"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/Sukavina.app
          cd build
          /usr/bin/zip -qry Sukavina-Portal-unsigned.ipa Payload
          shasum -a 256 Sukavina-Portal-unsigned.ipa > Sukavina-Portal-unsigned.ipa.sha256

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sukavina-Portal-unsigned-IPA
          path: |
            build/Sukavina-Portal-unsigned.ipa
            build/Sukavina-Portal-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish to internal SideStore source
        env:
          GH_TOKEN: ${{ secrets.SIDESTORE_REPO_TOKEN }}
          SIDESTORE_REPO: nguyenanhtruongvn/sukavina-sidestore
        run: |
          set -euo pipefail
          TAG="v${APP_VERSION}"
          IPA_PATH="$GITHUB_WORKSPACE/build/Sukavina.ipa"
          cp "$GITHUB_WORKSPACE/build/Sukavina-Portal-unsigned.ipa" "$IPA_PATH"
          DOWNLOAD_URL="https://github.com/${SIDESTORE_REPO}/releases/download/${TAG}/Sukavina.ipa"

          gh release create "$TAG" "$IPA_PATH" \
            --repo "$SIDESTORE_REPO" \
            --title "Sukavina ${APP_VERSION}" \
            --notes "Bản cập nhật nội bộ tự động từ Sukavina build ${APP_BUILD}."

          gh repo clone "$SIDESTORE_REPO" sidestore-source
          cp "$GITHUB_WORKSPACE/apps/ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png" \
            sidestore-source/icon.png
          export DOWNLOAD_URL IPA_PATH
          python3 - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          source_path = Path("sidestore-source/apps.json")
          source = json.loads(source_path.read_text(encoding="utf-8"))
          versions = source["apps"][0]["versions"]
          latest = {
              "version": os.environ["APP_VERSION"],
              "date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "localizedDescription": f"Bản cập nhật nội bộ tự động, build {os.environ['APP_BUILD']}.",
              "downloadURL": os.environ["DOWNLOAD_URL"],
              "size": Path(os.environ["IPA_PATH"]).stat().st_size,
              "minOSVersion": "14.0",
          }
          source["apps"][0]["versions"] = [latest] + [
              item for item in versions if item.get("version") != latest["version"]
          ][:2]
          source_path.write_text(json.dumps(source, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

          cd sidestore-source
          git config user.name "Sukavina Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps.json icon.png
          git commit -m "release: Sukavina ${APP_VERSION}"
          git push origin main

          RELEASE_INDEX=0
          gh api "repos/${SIDESTORE_REPO}/releases?per_page=100" --jq '.[].tag_name' | while IFS= read -r OLD_TAG; do
            RELEASE_INDEX=$((RELEASE_INDEX + 1))
            if [ "$RELEASE_INDEX" -gt 3 ]; then
              gh release delete "$OLD_TAG" --repo "$SIDESTORE_REPO" --cleanup-tag --yes
            fi
          done
