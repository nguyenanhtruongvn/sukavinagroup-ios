name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'apps/web/ios/**'
      - 'apps/web/capacitor.config.ts'
      - 'apps/web/package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/build-ios-unsigned.yml'

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Capacitor dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Build iOS app without code signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project apps/web/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            clean build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH='build/DerivedData/Build/Products/Release-iphoneos/App.app'
          test -d "$APP_PATH"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/Sukavina.app
          cd build
          /usr/bin/zip -qry Sukavina-Portal-unsigned.ipa Payload
          shasum -a 256 Sukavina-Portal-unsigned.ipa > Sukavina-Portal-unsigned.ipa.sha256

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sukavina-Portal-unsigned-IPA
          path: |
            build/Sukavina-Portal-unsigned.ipa
            build/Sukavina-Portal-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14
